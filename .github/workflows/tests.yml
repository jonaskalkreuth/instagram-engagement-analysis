name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # uv reads the Python version from .python-version (3.12).
      - run: uv sync --locked
      - run: uv run --locked pytest -q
