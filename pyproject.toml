[project]
name = "insta-analytics"
version = "0.1.0"
description = "Instagram musician analytics pipeline + case-study (portfolio)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.1",
    "httpx>=0.27",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "streamlit>=1.38",  # dashboard
    "plotly>=5.24",  # dashboard charts
    "pycountry>=24.6",  # ISO-2 country codes → name/ISO-3 for the choropleth
    "pydantic-settings>=2.4",
    "pytz>=2024.1",  # DuckDB needs it to hand TIMESTAMPTZ values back to Python
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insta_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
